
name: carecart
description: "CareCart - An accessible healthcare companion."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/carecart_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/carecart_icon.png"
